  termsOfService: https://api-portal.hlag.com/terms
  contact:
    name: API Portal
    url: https://api-portal.hlag.com
  license:
    name: Privacy Terms
    url: https://api-portal.hlag.com/privacy
  version: 1.1.1
servers:
  - url: https://api.hlag.com/hlag/external/iot
  - url: https://mock.api-portal.hlag.com/iot
security:
  - Client ID Header: []
    Client Secret Header: []
tags:
  - name: Subscriptions
    description: Subscription operations
paths:
  /v1/event-subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Create a subscription
      description: >
        Creates a new subscription and allows events matching the subscription
        to be pushed to the `callBackUrl`
      parameters:
        - $ref: '#/components/parameters/authorizationParam'
      requestBody:
        description: |
          Parameters used to configure the subscription.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscriptionBodyWithCreds'
        required: true
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '400':
          description: CarrierBookingReference should be a number.
        '403':
          description: Not allowed to subscribe for this shipment.
        '404':
          description: No shipment with this carrierBookingReference found.
        '409':
          description: >-
            Subscribed shipment does not contain any container type which is
            suitable for Live Position product
        '422':
          description: >-
            The shipment is already in progress. Setting up a subscription is
            not possible anymore.
        '503':
          description: Subscription request processing server error. Try later.
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /v1/event-subscriptions/{subscriptionID}:
    put:
      tags:
        - Subscriptions
      summary: Modify a subscription
      description: |
        Updates an existing subscription callback details.
      parameters:
        - $ref: '#/components/parameters/authorizationParam'
        - $ref: '#/components/parameters/subscriptionID'
      requestBody:
        description: |
          Parameters used to configure the subscription.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscriptionBodyWithCreds'
        required: true
      responses:
        '200':
          description: Subscription updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '400':
          description: CarrierBookingReference should be a number.
        '409':
          description: No active subscription found.
        '503':
          description: Subscription request processing server error. Try later.
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    subscriptionBody:
      required:
        - callbackUrl
      type: object
      allOf:
        - type: object
          properties:
            callbackUrl:
              $ref: '#/components/schemas/callbackUrl'
        - $ref: '#/components/schemas/iotSubscriptionBody'
    callbackCredentials:
      type: object
      anyOf:
        - type: object
          properties:
            apiKeys:
              $ref: '#/components/schemas/apiKeyList'
        - type: object
          properties:
            oauth:
              $ref: '#/components/schemas/oAuthTokenRequest'
        - type: object
          properties:
            secret:
              $ref: '#/components/schemas/secret'
    subscriptionBodyWithCreds:
      required:
        - callbackCredentials
      type: object
      allOf:
        - $ref: '#/components/schemas/subscriptionBody'
        - type: object
          properties:
            callbackCredentials:
              $ref: '#/components/schemas/callbackCredentials'
    subscription:
      type: object
      allOf:
        - type: object
          properties:
            organisation:
              $ref: '#/components/schemas/organisation'
        - type: object
          properties:
            userid:
              $ref: '#/components/schemas/userid'
        - type: object
          properties:
            subscriptionID:
              $ref: '#/components/schemas/subscriptionID'
        - $ref: '#/components/schemas/subscriptionBodyWithCreds'
    carrierBookingReference:
      maxLength: 35
      pattern: ^\S+(\s+\S+)*$
      type: string
      description: A set of unique characters provided by carrier to identify a booking.
      example: '12345678'
    error:
      required:
        - errorDateTime
        - errors
        - httpMethod
        - requestUri
        - statusCode
        - statusCodeText
      type: object
      properties:
        httpMethod:
          type: string
          description: |
            The http request method type e.g. GET, POST
          example: POST
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - OPTION
            - PATCH
        requestUri:
          type: string
          description: |
            The request URI as it was sent
          example: /v1/events
        statusCode:
          type: integer
          description: |
            The HTTP status code
          format: int32
          example: 400
        statusCodeText:
          maxLength: 50
          type: string
          description: |
            The textual representation of the status code
          example: Bad Request
        errorMessage:
          maxLength: 200
          type: string
          description: |
            Other error information
          example: The supplied data could not be accepted
        providerCorrelationID:
          maxLength: 100
          type: string
          description: |
            A unique identifier for the transaction, e.g. a UUID
          example: 4426d965-0dd8-4005-8c63-dc68b01c4962
        errorDateTime:
          type: string
          description: |
            The date and time (in ISO 8601 format) the error occurred.
          format: date-time
        errors:
          minItems: 1
          type: array
          description: |
            List of detailed errors, e.g. fields that could not pass validation
          items:
            allOf:
              - $ref: '#/components/schemas/detailedError'
    detailedError:
      required:
        - message
        - reason
      type: object
      properties:
        errorCode:
          maximum: 9999
          minimum: 7000
          type: integer
          description: >
            Standard error code see http://dcsa.org/error-codes (to be created).
            Examples: 7003 – out or range value, 7004 -  invalid type
          format: int32
          example: 7003
        field:
          maxLength: 50
          type: string
          description: >
            The field that caused the error, e.g. a failed validation. The field
            can be expressed as a
            [JSONpath](https://github.com/json-path/JsonPath)
          example: location.facilityCode
        value:
          maxLength: 500
          type: string
          description: |
            The value that of the field that caused the error
          example: SG SIN WHS
        reason:
          maxLength: 100
          type: string
          description: |
            High level error message
          example: invalidQuery
        message:
          maxLength: 200
          type: string
          description: |
            Additional information as to why the error occured
          example: Spaces not allowed in facility code
    subscriptionID:
      type: string
      description: |
        A unique ID for that subscription
      format: uuid
      example: 8fbdc2d8-57c8-48b9-a04b-18fd8ec1d809
    organisation:
      type: string
      description: |
        The organisation of the subcriber
      example: https://hlagweb.b2clogin.com/279e785a-03bc-4336-bca9-90e8a6e6b8e5/v2.0/
    userid:
      type: string
      description: |
        The userid of the subcriber
      example: myuser
