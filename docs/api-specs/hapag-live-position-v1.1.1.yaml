        apiKeyValue:
          type: string
    oAuthTokenRequest:
      required:
        - oauthClientId
        - oauthClientSecret
        - oauthTokenUrl
      type: object
      properties:
        oauthTokenUrl:
          type: string
        oauthClientId:
          type: string
        oauthClientSecret:
          type: string
    callbackUrl:
      type: string
      description: >
        The endPoint where a Carrier whould send back events to the Shipper. The
        callback can contain query parameters uniquely identifying the
        originator of the events.
      format: uri
      example: >-
        https://myserver.com/send/callback/here?shipperRef=<shipper defined
        unique id>
    iotSubscriptionBody:
      type: object
      allOf:
        - type: object
          properties:
            eventType:
              allOf:
                - $ref: '#/components/schemas/eventType'
        - type: object
          properties:
            carrierBookingReference:
              allOf:
                - $ref: '#/components/schemas/carrierBookingReference'
                - description: >
                    The reference to a Booking. Using this filter in a
                    subscription will only return Events that are related to the
                    `carrierBookingReference` specified
    eventType:
      type: string
      description: |
        eventType for which to create a subscription 
      example: '["IOT"]'
      enum:
        - IOT
        - IOT_AUTOMATIC
  parameters:
    authorizationParam:
      name: Authorization
      in: header
      required: false
      style: simple
      explode: false
      schema:
        minimum: 0
        type: string
    signatureHeader:
      name: Signature
      in: header
      description: |
        The signature certifying the request originates from the carrier
      required: true
      deprecated: true
      style: simple
      explode: false
      schema:
        type: object
        properties:
          keyId:
            type: string
            format: uuid
            example: 4fb682bc-3cd1-43a9-a23a-618a61bd87ca
          created:
            type: integer
            example: 1591960384
          headers:
            type: string
            example: (request-target) (created) date host
          signature:
            type: string
            example: aGkgZnJvbSBkZW5tYXJr
    subscriptionIDHeader:
      name: Subscription-ID
      in: header
      description: |
        The ID of the subscription triggering the event being sent
      required: true
      style: simple
      explode: false
      schema:
        type: string
        format: uuid
        example: b80d923d-e8ac-4c34-9506-55d3de347034
    notificationSignature:
      name: Notification-Signature
      in: header
      description: >
        the Notification-Signature is used to sign the notification. The header
        has the following format: 

           Notification-Signature: <signature-type>=<signature>

        The `signature-type` part is a keyword that determines which algorithm
        was used to compute the signature.


        The signature ***MUST*** cover the entire request body of the request
        including whitespace and newlines. The content ***MUST*** be decoded
        into bytes using the UTF-8 encoding before computing the signature. None
        of the HTTP headers nor the request URL is covered by the signature.


        Supported signature typies are:

        - sha256


        Example:
        `sha256=ae688919f5e31f4c210ca6af362ce4d9ed87acfb51c1721a8507ee395de5e2de`
      required: true
      style: simple
      explode: false
      schema:
        pattern: \s*([a-zA-Z0-9-_+]+=[0-9a-fA-F]+)\s*
        type: string
        example: >-
          sha256=ae688919f5e31f4c210ca6af362ce4d9ed87acfb51c1721a8507ee395de5e2de
    subscriptionID:
      name: subscriptionID
      in: path
      description: |
        The ID of the subscription to retrieve
      required: true
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/subscriptionID'
      example: 123e4567-e89b-12d3-a456-426614174000
  securitySchemes:
    clientId:
      type: apiKey
      name: x-hlag-client-id
      in: header
      x-key-type: client_id
    clientSecret:
      type: apiKey
      name: x-hlag-client-secret
      in: header
      x-key-type: client_secret
    Client ID Header:
      type: apiKey
      description: The client ID to identify the partner calling the API.
      name: X-IBM-Client-Id
      in: header
      x-key-type: client_id
    Client Secret Header:
      type: apiKey
      description: The client secret belonging to the client ID.
      name: X-IBM-Client-Secret
      in: header
      x-key-type: client_secret
