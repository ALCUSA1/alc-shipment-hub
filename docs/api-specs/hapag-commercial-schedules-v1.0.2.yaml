tags:
  - name: Point To Point
    description: ' '
  - name: Vessel Schedule
    description: ' '
paths:
  /point-to-point-routes:
    get:
      tags:
        - Point To Point
      summary: Point to Point Routing
      description: >
        Access end-to-end shipment route options and detailed vessel timetables
        with estimated departure and arrival times for each port call. This
        includes point-to-point specification of all transport legs, estimated
        timings, estimated schedules and interdependencies between transport
        legs.


        The list of solutions returned in the response can be tailored to a
        specific need by combining available query parameters.


        The minimum required query parameters are `placeOfReceipt` and
        `placeOfDelivery`. If no further query parameters are used to tailor the
        response, the provider of the GET endpoint will return their best
        suggestions in the response. 


        The `GET /v1/point-to-point-routes` endpoint can be implemented
        independently of having implemented the `GET /v1/port-schedules`  and
        `GET /v1/vessel-schedules`  endpoints.
      operationId: get-v1-point-to-point
      parameters:
        - name: placeOfReceipt
          in: query
          description: The `UNLocationCode` specifying where the place is located.
          required: true
          style: form
          explode: false
          schema:
            maxLength: 5
            minLength: 5
            pattern: ^[A-Z]{2}[A-Z2-9]{3}$
            type: string
            example: NLAMS
        - name: placeOfDelivery
          in: query
          description: The `UNLocationCode` specifying where the place is located.
          required: true
          style: form
          explode: false
          schema:
            maxLength: 5
            minLength: 5
            pattern: ^[A-Z]{2}[A-Z2-9]{3}$
            type: string
            example: NLAMS
        - name: departureStartDate
          in: query
          description: >
            Limit the result based on the earliest departureDate. 

            - If provided without departureEndDate, returns all routings with
            departures from the specified departureStartDate onwards.

            - If provided with departureEndDate, returns all routings with
            departures within the specified date range, inclusive of both dates.

            - If the same date is provided for both departureStartDate and
            departureEndDate, returns all routings with departures on that
            specific date.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: departureEndDate
          in: query
          description: >
            Limit the result based on the latest departureDate. 

            - If provided without departureStartDate, returns all routings with
            departures up to the specified departureEndDate.

            - If provided with departureStartDate, returns all routings with
            departures within the specified date range, inclusive of both dates.

            - If the same date is provided for both departureStartDate and
            departureEndDate, returns all routings with departures on that
            specific date.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: arrivalStartDate
          in: query
          description: >
            Limit the result based on the earliest arrivalDate.

            - If provided without arrivalEndDate, returns all routings with
            arrivals from the specified arrivalStartDate.

            - If provided with arrivalEndDate, returns all routings with
            arrivals within the specified date range, inclusive of both dates.

            - If the same date is provided for both arrivalStartDate and
            arrivalEndDate, returns all routings with arrivals on that specific
            date.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: arrivalEndDate
          in: query
          description: >
            Limit the result based on the latest arrivalDate.

            - If provided without arrivalStartDate, returns all routings with
            arrivals up to the specified arrivalEndDate.

            - If provided with arrivalStartDate, returns all routings with
            arrivals within the specified date range, inclusive of both dates.

            - If the same date is provided for both arrivalStartDate and
            arrivalEndDate, returns all routings with arrivals on that specific
            date.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: maxTranshipment
          in: query
          description: >-
            Specifies the maximum number of transhipments that the proposed
            routings can have in the response. By default, transhipments are
            allowed and the responses can have either direct routings or
            routings with transhipment. The default value of maximum
            transhipments is defined by the carrier for when the consumer does
            not provide a value. If the user sets the number of transhipments to
            0, only direct routings can be returned in the response.
          required: false
          style: form
          explode: false
          schema:
            minimum: 0
            type: integer
            format: int32
            example: 1
        - name: receiptTypeAtOrigin
          in: query
          description: >
            Indicates the type of service offered at Origin. **Carriers can
            choose to define a default value when the consumer does not provide
            it.**
              - `CY` (Container yard (incl. rail ramp))  
              - `SD` (Store Door)  
              - `CFS` (Container Freight Station)
          required: false
          style: form
          explode: false
          schema:
            maxLength: 3
            type: string
            example: CY
            enum:
              - CY
              - SD
              - CFS
        - name: deliveryTypeAtDestination
          in: query
          description: >
            Indicates the type of service offered at Destination. **Carriers can
            choose to define a default value when the consumer does not provide
            it.**
              - `CY` (Container yard (incl. rail ramp))  
              - `SD` (Store Door)  
              - `CFS` (Container Freight Station)
          required: false
          style: form
          explode: false
          schema:
            maxLength: 3
            type: string
            example: CY
            enum:
              - CY
              - SD
              - CFS
        - name: limit
          in: query
          description: Specifies the maximum number of `Point-to-Point` objects to return.
          required: false
          style: form
          explode: false
          schema:
            minimum: 1
            type: integer
            format: int32
            example: 15
            default: 15
        - name: cursor
          in: query
          description: >-
            A server generated value to specify a specific point in a collection
            result, used for pagination.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 1024
            type: string
          example: fE9mZnNldHw9MTAmbGltaXQ9MTA
        - $ref: '#/components/parameters/Api-Version-Major'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
            Next-Page-Cursor:
              description: >
                The Next-Page-Cursor header contains a cursor value that points
                to the next page of results in a paginated API response.

                When an initial `GET` endpoint request includes the query
                parameter `limit=...` the API provider limits the number of
                items in the root array of the response to the specified limit.
                If the response would contain more items than the specified
                limit, the API provider includes only the first set of limit
                items and appends the following response header:

                `Next-Page-Cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`, a string that
                acts as a reference for the next page of results. The cursor
                value is used in subsequent requests to retrieve the next page
                by passing it as a query parameter:
                `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`.


                To retrieve the next page, the API consumer sends a `GET`
                request to the endpoint URL with only
                `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA` as query parameter. The
                limit of items per page and any other query parameters may not
                be altered, therefore it may also not be specified when
                requesting subsequent pages. The API provider must ignore any
                query parameters passed along with a cursor, and should return a
                `400` error if any other query parameter is passed along with
                the `cursor`.
              style: simple
              explode: false
              schema:
                maxLength: 1024
                type: string
                example: fE9mZnNldHw9MTAmbGltaXQ9MTA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointToPoint'
        '400':
          description: Bad Request
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned.
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example 1:
                  value:
                    httpMethod: GET
                    requestUri: https://dcsa.org/cs/v1/point-to-point
                    statusCode: 400
                    statusCodeText: Bad Request
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2019-11-11T23:11:00.000Z'
                    errors:
                      - errorCode: 7005
                        property: placeOfDelivery
                        value: SG
                        errorCodeText: invalidQuery
                        errorCodeMessage: PlaceOfDelivery does not exist
        '500':
          description: Internal Server Error
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned.
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example 1:
                  value:
                    httpMethod: GET
                    requestUri: https://dcsa.org/cs/v1/point-to-point
                    statusCode: 500
                    statusCodeText: Internal Server Error
                    statusCodeMessage: Unable to process request
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2019-11-11T23:11:00.000Z'
                    errors:
                      - errorCode: 7007
                        property: UNLocationCode
                        value: NA
                        errorCodeText: invalidQuery
                        errorCodeMessage: UNLocationCode does not exist
  /vessel-schedules:
    get:
      tags:
        - Vessel Schedule
      summary: Vessel Schedule
      description: >
        Provides, for a required specific service and/or voyage and/or vessel
        and/or location, the timetable of estimated departure and arrival times
        for each port call on the rotation of the vessel(s).


        The list of schedules returned in the response can be tailored to
        specific needs by combining available query parameters. 


        A filter parameter or a combination of filter parameters MUST always be
        provided to call the endpoint. Examples of typical query parameters and
        expected payload returned in the response:


        - a) `carrierServiceCode`: Get all vessels and their full voyages within
        a service   


        - b) `carrierServiceCode` **&** `carrierVoyageNumber`: Get a specific
        full voyage within a service


        - c) `carrierServiceCode` **&** `vesselIMONumber`: Get a specific
        vessel’s full voyages within a service. 


        - d) `vesselIMONumber`: Get all full voyages for a specific vessel
        across all the services in which it is involved.


        - e) `UNLocationCode`: Get all vessels and their full voyages where the
        specific `UNLocationCode` is involved


        - f) `UNLocationCode` **&** `facilitySMDGCode`: Get all vessels and
        their full voyages where the specific  `UNLocationCode` and
        `facilitySMDGCode` is involved


        Other combinations using `vesselName`, `universalServiceReference`,
        `universalVoyageReference`, `vesselOperatorCarrierCode`, `startDate`,
        `endDate` are possible. 


        The filter parameters `startDate` and `endDate` MUST always be used in
        combination with any of the other available parameters.


        The resulting payload returned in the responses will always include
        **entire voyage(s) being matched**. This means that even though a filter
        only matches a single `Port` (`UNLocationCode`) in a `Voyage` or a
        single `Timestamp` within a `Port` in a `Voyage` - **the entire Voyage
        matched** is returned. If the `carrierImportVoyageNumber` of the `Port`
        differs from the `carrierExportVoyageNumber` of the `Port` then the
        **entire Voyage** for both these Voyage numbers are included. An example
        of this is when `&UNLocationCode=DEHAM` is used as a filter parameter.
        In this case **entire Voyages** would be listed where `DEHAM` is a
        `Port`.


        Be aware that it is possible to specify filters that are mutually
        exclusive resulting in an empty response list. An example of this could
        be when both using `vesselIMONumber` and `vesselName` filters at the
        same time: `&vesselIMONumber=9321483&vesselName=King of the Seas`. If no
        `Vessel` exists where `vesselIMONumber` is **9321483** and `vesselName`
        is **King of the Seas** then the result will be an empty list. 


        If no `startDate` filter is provided, then **3 months** before the
        request date should be used as default. If no `endDate` filter is
        provided, then **6 months** after the request date should be used as
        default. The endpoint provider can customize these based on their
        business definitions and inform the consumers what to expect in a
        response when these filters are not used. 


        The `GET /v1/vessel-schedules` endpoint can be implemented independently
        of having implemented the  `GET /v1/point-to-point-routes`  and `GET
        /v1/port-schedules`  endpoints. 


        **IMPORTANT**: This endpoint is for carriers to make available vessel
        schedules to BCO, LSP, and Solution Platforms, with a commercial
        purpose; this is out of the boundaries of their vessel schedules
        alignment with other carriers and terminals for operational purposes for
        which the Operational Vessel Schedules
        [API](https://app.swaggerhub.com/apis/dcsaorg/DCSA_OVS/3.0.0) is used
        between carriers, and carriers and terminals.
      operationId: get-v1-vessel-schedule
      parameters:
        - name: vesselIMONumber
          in: query
          description: >-
            The unique reference for a registered Vessel. The reference is the
            International Maritime Organisation (IMO) number, also sometimes
            known as the Lloyd&apos;s register code, which does not change
            during the lifetime of the vessel.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 8
            minLength: 7
            pattern: ^\d{7,8}$
            type: string
            example: '9321483'
        - name: vesselName
          in: query
          description: >-
            The name of a vessel. The result will only return schedules
            including the vessel with the specified name.  Be aware that the
            vesselName is not unique and might match multiple vessels.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 50
            pattern: ^\S(?:.*\S)?$
            type: string
            example: King of the Seas
        - name: carrierServiceCode
          in: query
          description: >-
            The carrier specific service code to filter by. The result will only
            return schedules including the service code.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 11
            type: string
            example: FE1
        - name: universalServiceReference
          in: query
          description: >-
            The Universal Service Reference (USR) as defined by DCSA to filter
            by.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 8
            minLength: 8
            pattern: ^SR\d{5}[A-Z]$
            type: string
            example: SR12345A
        - name: carrierVoyageNumber
          in: query
          description: >-
            The carrier specific identifier of a Voyage - can be both
            `importVoyageNumber` and `exportVoyageNumber`. The result will only
            return schedules including the Ports where `carrierVoyageNumber` is
            either `carrierImportVoyageNumber` or `carrierExportVoyageNumber`.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 50
            type: string
            example: 2103S
        - name: universalVoyageReference
          in: query
          description: >-
            The Universal Reference of a Voyage - can be both
            `importUniversalVoyageReference` and
            `exportUniversalVoyageReference`. The result will only return
            schedules including the Ports where `universalVoyageReference` is
            either `importUniversalVoyageReference` or
            `exportUniversalVoyageReference`.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 5
            pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
            type: string
            example: 2201N
        - name: UNLocationCode
          in: query
          description: >-
            The UN Location Code specifying where a port is located.  Specifying
            this filter will only return schedules including entire Voyages
            related to this particular UN Location Code.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 5
            minLength: 5
            pattern: ^[A-Z]{2}[A-Z2-9]{3}$
            type: string
            example: NLAMS
        - name: facilitySMDGCode
          in: query
          description: >-
            The facilitySMDGCode specifying a specific facility (using SMDG
            Code). Be aware that the `facilitySMDGCode` does not contain a
            `UNLocationCode` - this must be specified in the `UNLocationCode`
            filter.  Specifying this filter will only return schedules including
            entire Voyages related to this particular `facilitySMDGCode`.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 6
            type: string
            example: APM
        - name: vesselOperatorCarrierCode
          in: query
          description: >-
            The carrier who is in charge of the vessel operation based on either
            the SMDG or SCAC code lists.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 10
            type: string
            example: MAEU
        - name: startDate
          in: query
          description: >
            The start date of the period for which schedule information is
            requested. If a date of any Timestamp (ATA, ETA or PTA) inside a
            PortCall matches a date on or after (≥) the `startDate` the entire
            Voyage (import- and export-Voyage) matching the PortCall will be
            included in the result. All matching is done towards local Date at
            the place of the port call.

            If this filter is not provided the default value is `3 months` prior
            to request time.  The value is populated in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) date
            format.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: >
            The end date of the period for which schedule information is
            requested. If a date of any Timestamp (ATA, ETA or PTA) inside a
            PortCall matches a date on or before (≤) the `endDate` the entire
            Voyage(import- and export-Voyage) matching the PortCall will be
            included in the result. All matching is done towards local Date at
            the place of the port call.  

            If this filter is not provided the default value is `6 months` after
            request time.  The value is populated in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) date
            format.
          required: false
          style: form
          explode: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: >-
            Specifies the maximum number of `Service Schedule` objects to
            return.
          required: false
          style: form
          explode: false
          schema:
            minimum: 1
            type: integer
            format: int32
            example: 15
            default: 15
        - name: cursor
          in: query
          description: >-
            A server generated value to specify a specific point in a collection
            result, used for pagination.
          required: false
          style: form
          explode: false
          schema:
            maxLength: 1024
            type: string
            example: fE9mZnNldHw9MTAmbGltaXQ9MTA
        - $ref: '#/components/parameters/Api-Version-Major'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned.
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
            Next-Page-Cursor:
              description: >
                The Next-Page-Cursor header contains a cursor value that points
                to the next page of results in a paginated API response.

                When an initial `GET` endpoint request includes the query
                parameter `limit=...` the API provider limits the number of
                items in the root array of the response to the specified limit.
                If the response would contain more items than the specified
                limit, the API provider includes only the first set of limit
                items and appends the following response header:

                `Next-Page-Cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`, a string that
                acts as a reference for the next page of results. The cursor
                value is used in subsequent requests to retrieve the next page
                by passing it as a query parameter:
                `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`.


                To retrieve the next page, the API consumer sends a `GET`
                request to the endpoint URL with only
                `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA` as query parameter. The
                limit of items per page and any other query parameters may not
                be altered, therefore it may also not be specified when
                requesting subsequent pages. The API provider must ignore any
                query parameters passed along with a cursor, and should return a
                `400` error if any other query parameter is passed along with
                the `cursor`.
              style: simple
              explode: false
              schema:
                maxLength: 1024
                type: string
                example: fE9mZnNldHw9MTAmbGltaXQ9MTA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSchedule'
        '400':
          description: Bad Request
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned.
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example 1:
                  value:
                    httpMethod: GET
                    requestUri: https://dcsa.org/cs/v1/vessel-schedule
                    statusCode: 400
                    statusCodeText: Bad Request
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2019-11-11T23:11:00.000Z'
                    errors:
                      - errorCode: 7007
                        property: UNLocationCode
                        value: NA
                        errorCodeText: invalidQuery
                        errorCodeMessage: UNLocationCode does not exist
        '500':
          description: Internal Server Error
          headers:
            API-Version:
              description: >
                SemVer used to indicate the version of the contract (API
                version) returned.
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example 1:
                  value:
                    httpMethod: GET
                    requestUri: https://dcsa.org/cs/v1/vessel-schedule
                    statusCode: 500
                    statusCodeText: Internal Server Error
                    statusCodeMessage: Cannot process request.
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2019-11-11T23:11:00.000Z'
                    errors:
                      - errorCode: 7007
                        property: UNLocationCode
