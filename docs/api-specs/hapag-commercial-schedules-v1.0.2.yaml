components:
  schemas:
    PlaceOfReceipt:
      title: Place of Receipt
      required:
        - dateTime
        - facilityTypeCode
        - location
      type: object
      properties:
        facilityTypeCode:
          maxLength: 4
          type: string
          description: >
            The code to identify the specific type of facility. The code
            indicates which role the facility plays during the transportCall.

            - `BORD` (Border)

            - `CLOC` (Customer Location)

            - `COFS` (Container Freight Station)

            - `OFFD` (Off Dock Storage)

            - `DEPO` (Depot)

            - `INTE` (Inland Terminal)

            - `POTE` (Port Terminal)

            - `PBPL` (Pilot Boarding Place)

            - `BRTH` (Berth)

            - `RAMP` (Ramp)

            - `WAYP` (Waypoint)
          example: POTE
        location:
          $ref: '#/components/schemas/Location'
        dateTime:
          type: string
          description: >-
            The local date and time, when the event will take place, in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) format
            specifying the offset.
          format: date-time
      description: |
        The Location specifying where the place of receipt is located.
    PlaceOfDelivery:
      title: Place of Delivery
      required:
        - dateTime
        - facilityTypeCode
        - location
      type: object
      properties:
        facilityTypeCode:
          maxLength: 4
          type: string
          description: >
            The code to identify the specific type of facility. The code
            indicates which role the facility plays during the transportCall.

            - `BORD` (Border)

            - `CLOC` (Customer Location)

            - `COFS` (Container Freight Station)

            - `OFFD` (Off Dock Storage)

            - `DEPO` (Depot)

            - `INTE` (Inland Terminal)

            - `POTE` (Port Terminal)

            - `PBPL` (Pilot Boarding Place)

            - `BRTH` (Berth)

            - `RAMP` (Ramp)

            - `WAYP` (Waypoint)
          example: POTE
        location:
          $ref: '#/components/schemas/Location'
        dateTime:
          type: string
          description: >-
            The local date and time, when the event will take place, in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) format
            specifying the offset.
          format: date-time
      description: |
        The Location specifying where the place of delivery is located.
    PlaceOfArrival:
      title: Place of Arrival
      required:
        - dateTime
        - facilityTypeCode
        - location
      type: object
      properties:
        facilityTypeCode:
          maxLength: 4
          type: string
          description: >
            The code to identify the specific type of facility. The code
            indicates which role the facility plays during the transportCall.

            - `BORD` (Border)

            - `CLOC` (Customer Location)

            - `COFS` (Container Freight Station)

            - `OFFD` (Off Dock Storage)

            - `DEPO` (Depot)

            - `INTE` (Inland Terminal)

            - `POTE` (Port Terminal)

            - `PBPL` (Pilot Boarding Place)

            - `BRTH` (Berth)

            - `RAMP` (Ramp)

            - `WAYP` (Waypoint)
          example: POTE
        location:
          $ref: '#/components/schemas/Location'
        dateTime:
          type: string
          description: >-
            The local date and time, when the event will take place, in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) format
            specifying the offset.
          format: date-time
      description: |
        The Location specifying where the place of arrival is located.
    PlaceOfDeparture:
      title: Place of Departure
      required:
        - dateTime
        - facilityTypeCode
        - location
      type: object
      properties:
        facilityTypeCode:
          maxLength: 4
          type: string
          description: >
            The code to identify the specific type of facility. The code
            indicates which role the facility plays during the transportCall.

            - `BORD` (Border)

            - `CLOC` (Customer Location)

            - `COFS` (Container Freight Station)

            - `OFFD` (Off Dock Storage)

            - `DEPO` (Depot)

            - `INTE` (Inland Terminal)

            - `POTE` (Port Terminal)

            - `PBPL` (Pilot Boarding Place)

            - `BRTH` (Berth)

            - `RAMP` (Ramp)

            - `WAYP` (Waypoint)
          example: POTE
        location:
          $ref: '#/components/schemas/Location'
        dateTime:
          type: string
          description: >-
            The local date and time, when the event will take place, in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) format
            specifying the offset.
          format: date-time
      description: |
        The Location specifying where the place of departure is located.
    PointToPoint:
      title: Point to Point
      required:
        - legs
        - placeOfDelivery
        - placeOfReceipt
      type: object
      properties:
        placeOfReceipt:
          $ref: '#/components/schemas/PlaceOfReceipt'
        placeOfDelivery:
          $ref: '#/components/schemas/PlaceOfDelivery'
        receiptTypeAtOrigin:
          maxLength: 3
          type: string
          description: |
            Indicates the type of service offered at `Origin`. The options are:
            - `CY` (Container yard (incl. rail ramp))
            - `SD` (Store Door)
            - `CFS` (Container Freight Station)
          example: CY
          enum:
            - CY
            - SD
            - CFS
        deliveryTypeAtDestination:
          maxLength: 3
          type: string
          description: >
            Indicates the type of service offered at `Destination`. The options
            are:

            - `CY` (Container yard (incl. rail ramp))

            - `SD` (Store Door)

            - `CFS` (Container Freight Station)
          example: CY
          enum:
            - CY
            - SD
            - CFS
        cutOffTimes:
          type: array
          description: >-
            A list of cut-offs times provided by the carrier when available. A
            cut-off time indicates the latest date and time by which a task must
            be completed. For example, the latest date and time by which a
            container must be delivered to a terminal to be loaded on a vessel,
            or where certain documentation must be provided by the Shipper.
          items:
            $ref: '#/components/schemas/CutOffTime'
        solutionNumber:
          minimum: 1
          type: integer
          description: >-
            Solution number, starting with 1. Used to group and identify similar
            or same routings in the response as per the carrier commercial
            definitions.
          format: int32
          example: 1
        transitTime:
          type: integer
          description: >-
            The estimated total time in days that it takes a shipment to move
            from place of receipt to place of delivery. Transit time includes
            stop-over time during transhipments and waiting time at connection
            points, if applicable, thus can vary between the same locations.
          format: int32
          example: 10
        legs:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Leg'
    TransportCall:
      title: Transport Call
      required:
        - carrierImportVoyageNumber
        - timestamps
        - transportCallReference
      type: object
      properties:
        portVisitReference:
          maxLength: 50
          type: string
          description: >-
            The unique reference that can be used to link different
            `transportCallReferences` to the same port visit. The reference is
            provided by the port to uniquely identify a port call.
          example: NLRTM1234589
        transportCallReference:
          maxLength: 100
          type: string
          description: >-
            The unique reference for a transport call. It’s the vessel
            operator’s responsibility to provide the Transport Call Reference,
            other parties are obliged to pick it up and use it. It can take the
            form of Port Call References as defined in OVS Definitions Document,
            or alternatively a reference as defined by the vessel operator.
          example: SR11111X-9321483-2107W-NLRTM-HPD2-1-1
        carrierImportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The identifier of an import voyage. The carrier-specific identifier
            of the import Voyage.
          example: 2103N
        carrierExportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The identifier of an export voyage. The carrier-specific identifier
            of the export Voyage.
          example: 2103S
        universalImportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the import Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage.The voyage reference
            must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        universalExportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the export Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage.The voyage reference
            must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        cutOffTimes:
          type: array
          description: >-
            A list of cut-offs times provided by the carrier when available. A
            cut-off time indicates the latest date and time by which a task must
            be completed. For example, the latest date and time by which a
            container must be delivered to a terminal to be loaded on a vessel,
            or where certain documentation must be provided by the Shipper.
          items:
            $ref: '#/components/schemas/CutOffTime'
        location:
          $ref: '#/components/schemas/TransportCallLocation'
        timestamps:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Timestamp'
    Timestamp:
      title: Timestamp
      required:
        - eventClassifierCode
        - eventDateTime
        - eventTypeCode
      type: object
      properties:
        eventTypeCode:
          type: string
          description: |
            Identifier for type of transportEvent.

            - `ARRI` (Arrived)
            - `DEPA` (Departed)
          example: ARRI
          enum:
            - ARRI
            - DEPA
        eventClassifierCode:
          type: string
          description: >
            Code for the event classifier. Values can vary depending on
            eventType.


            Possible values are:

            - `ACT` (Actual)

            - `EST` (Estimated)

            - `PLN` (Planned)
          example: PLN
          enum:
            - PLN
            - EST
            - ACT
        eventDateTime:
          type: string
          description: >-
            The local date and time, when the event takes place, in [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html) format
            specifying the offset.
          format: date-time
    ServiceSchedule:
      title: Service Schedule
      required:
        - carrierServiceCode
        - carrierServiceName
        - vesselSchedules
      type: object
      properties:
        carrierServiceName:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the service.
          example: Great Lion Service
        carrierServiceCode:
          maxLength: 11
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The carrier-specific code of the service for which the schedule
            details are published.
          example: FE1
        universalServiceReference:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          description: >-
            A global unique service reference, as per DCSA standard, agreed by
            VSA partners for the service.
          example: SR12345A
        vesselSchedules:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/VesselSchedule'
    VesselSchedule:
      title: Vessel Schedule
      required:
        - isDummyVessel
      type: object
      properties:
        vessel:
          $ref: '#/components/schemas/Vessel'
        isDummyVessel:
          type: boolean
          description: >-
            This property can be set to `true` when no vessel has been assigned,
            indicating that the `vesselIMONumber` does not exist.
        transportCalls:
          type: array
          items:
            $ref: '#/components/schemas/TransportCall'
    CutOffTime:
      title: Cut-Off Time
      required:
        - cutOffDateTime
        - cutOffDateTimeCode
      type: object
      properties:
        cutOffDateTimeCode:
          maxLength: 3
          type: string
          description: >
            Code for the cut-off time. Possible values are:
              - `DCO` (Documentation cut-off)
              - `VCO` (VGM cut-off)
              - `FCO` (FCL delivery cut-off)
              - `LCO` (LCL delivery cut-off) **Condition:** only when the `Receipt Type at Origin` is `CFS`
              - `PCO` (Port cut-off)
              - `ECP` (Empty container pick-up date and time)
              - `EFC` (Earliest full-container delivery date)
              - `RCO` (Reefer cut-off)
              - `DGC` (Dangerous Goods cut-off)
              - `OBC` (OOG/BB cut-off)
              - `TCO` (Transhipment cut-off)
              - `STA` (Standard booking acceptance)
              - `SPA` (Special booking acceptance)
              - `CUA` (Customs Acceptance)
              - `AFC` (Advanced filling cut-off)

            More details can be found on
            [GitHub](https://github.com/dcsaorg/DCSA-OpenAPI/blob/master/reference-data/CutOffDateTimeCodeList-CS_v1.0.0.csv)
          example: DCO
        cutOffDateTime:
          type: string
          description: >-
            Estimated cut-off time expressed in local time with offset following
            [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html)
            format.
          format: date-time
      description: Cut Off Times.
    Address:
      title: Address
      required:
        - city
        - countryCode
        - street
      type: object
      properties:
        street:
          maxLength: 70
          type: string
          description: The name of the street.
          example: Ruijggoordweg
        streetNumber:
          maxLength: 50
          type: string
          description: The number of the street.
          example: '100'
        floor:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The floor of the street number.
          example: N/A
        postCode:
          maxLength: 10
          type: string
          description: The post code.
          example: 1047 HM
        city:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the city.
          example: Amsterdam
        stateRegion:
          maxLength: 65
          type: string
          description: The name of the state/region.
          example: North Holland
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: >
            The 2 characters for the country code using [ISO 3166-1
            alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)
          example: NL
      description: An object for storing address related information.
    ErrorResponse:
      title: Error Response
      required:
        - errorDateTime
        - errors
        - httpMethod
        - requestUri
        - statusCode
        - statusCodeText
      type: object
      properties:
        httpMethod:
          type: string
          description: The HTTP method used to make the request e.g. `GET`, `POST`, etc
          example: POST
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - OPTION
            - PATCH
        requestUri:
          type: string
          description: The URI that was requested.
          example: /v1/events
        statusCode:
          type: integer
          description: The HTTP status code returned.
          format: int32
          example: 400
        statusCodeText:
          maxLength: 50
          type: string
          description: A standard short description corresponding to the HTTP status code.
          example: Bad Request
        statusCodeMessage:
          maxLength: 200
          type: string
          description: >-
            A long description corresponding to the HTTP status code with
            additional information.
          example: The supplied data could not be accepted
        providerCorrelationReference:
          maxLength: 100
          type: string
          description: >-
            A unique identifier to the HTTP request within the scope of the API
            provider.
          example: 4426d965-0dd8-4005-8c63-dc68b01c4962
        errorDateTime:
          type: string
          description: >-
            The DateTime corresponding to the error occurring. Must be formatted
            using [ISO
            8601](https://www.iso.org/iso-8601-date-and-time-format.html)
            format.
          format: date-time
        errors:
          minItems: 1
          type: array
          description: An array of errors providing more detail about the root cause.
          items:
            $ref: '#/components/schemas/DetailedError'
    Vessel:
      title: Vessel
      type: object
      properties:
        vesselIMONumber:
          maxLength: 8
          minLength: 7
          pattern: ^\d{7,8}$
          type: string
          description: >-
            The unique reference for a registered Vessel. The reference is the
            International Maritime Organisation (IMO) number, also sometimes
            known as the Lloyd&apos;s register code, which does not change
            during the lifetime of the vessel.
          example: '9321483'
        MMSINumber:
          maxLength: 9
          minLength: 9
          pattern: ^\d{9}$
          type: string
          description: >-
            Maritime Mobile Service Identities (MMSIs) are nine-digit numbers
            used by maritime digital selective calling (DSC), automatic
            identification systems (AIS) and certain other equipment to uniquely
            identify a ship or a coast radio station.
          example: '278111222'
        name:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The name of the Vessel given by the Vessel Operator and registered
            with IMO.
          example: King of the Seas
        flag:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: >-
            The flag of the nation whose laws the vessel is registered under.
            This is the [ISO
            3166](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en) two-letter
            country code.
          example: DE
        callSign:
          maxLength: 10
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            A unique alphanumeric identity that belongs to the vessel and is
            assigned by the International Telecommunication Union (ITU). It
            consists of a three letter alphanumeric prefix that indicates
            nationality, followed by one to four characters to identify the
            individual vessel. For instance, vessels registered under Denmark
            are assigned the prefix ranges 5PA-5QZ, OUAOZZ, and XPA-XPZ. The
            Call Sign changes whenever a vessel changes its flag.
          example: NCVV
        operatorCarrierCode:
          maxLength: 10
          type: string
          description: >-
            The carrier who is in charge of the vessel operation based on either
            the SMDG or SCAC code lists.
          example: MAEU
        operatorCarrierCodeListProvider:
          type: string
          description: >-
            Identifies the code list provider used for the operator and partner
            carriercodes.
          example: NMFTA
          enum:
            - SMDG
            - NMFTA
    Barge:
      title: Barge
      type: object
      properties:
        vesselIMONumber:
          maxLength: 8
          minLength: 7
          pattern: ^\d{7,8}$
          type: string
          description: >-
            The unique reference for a registered Vessel. The reference is the
            International Maritime Organisation (IMO) number, also sometimes
            known as the Lloyd&apos;s register code, which does not change
            during the lifetime of the vessel.
          example: '9321483'
        MMSINumber:
          maxLength: 9
          minLength: 9
          pattern: ^\d{9}$
          type: string
          description: >-
            Maritime Mobile Service Identities (MMSIs) are nine-digit numbers
            used by maritime digital selective calling (DSC), automatic
            identification systems (AIS) and certain other equipment to uniquely
            identify a ship or a coast radio station.
          example: '278111222'
        name:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The name of the Vessel given by the Vessel Operator and registered
            with IMO.
          example: King of the Seas
        flag:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: >-
            The flag of the nation whose laws the vessel is registered under.
            This is the ISO 3166 two-letter country code.
          example: DE
        callSign:
          maxLength: 10
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            A unique alphanumeric identity that belongs to the vessel and is
            assigned by the International Telecommunication Union (ITU). It
            consists of a three letter alphanumeric prefix that indicates
            nationality, followed by one to four characters to identify the
            individual vessel. For instance, vessels registered under Denmark
            are assigned the prefix ranges 5PA-5QZ, OUAOZZ, and XPA-XPZ. The
            Call Sign changes whenever a vessel changes its flag.
          example: NCVV
        operatorCarrierCode:
          maxLength: 10
          type: string
          description: >-
            The carrier who is in charge of the vessel operation based on either
            the SMDG or SCAC code lists.
          example: MAEU
        operatorCarrierCodeListProvider:
          type: string
          description: >-
            Identifies the code list provider used for the operator and partner
            carriercodes.
          example: NMFTA
          enum:
            - SMDG
            - NMFTA
    VesselTransport:
      title: Vessel Transport
      required:
        - modeOfTransport
      type: object
      properties:
        modeOfTransport:
          $ref: '#/components/schemas/ModeOfTransport'
        portVisitReference:
          maxLength: 50
          type: string
          description: >-
            The unique reference that can be used to link different
            `transportCallReferences` to the same port visit. The reference is
            provided by the port to uniquely identify a port call.
          example: NLAMS1234589
        transportCallReference:
          maxLength: 100
          type: string
          description: >-
            The unique reference for a transport call. It’s the vessel
            operator’s responsibility to provide the Transport Call Reference,
            other parties are obliged to pick it up and use it. It can take the
            form of Port Call References as defined in OVS Definitions Document,
            or alternatively a reference as defined by the vessel operator.
          example: SR11111X-9321483-2107W-NLAMS-ACT-1-1
        servicePartners:
          type: array
          items:
            $ref: '#/components/schemas/ServicePartner'
        universalServiceReference:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          description: >
            A global unique service reference, as per DCSA standard, agreed by
            VSA partners for the service. The service reference must match the
            regular expression pattern: `SR\d{5}[A-Z]`. The letters `SR`
            followed by `5` digits, followed by a checksum-character as a
            capital letter from `A to Z`.
          example: SR12345A
        universalExportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the export Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage. The voyage
            reference must match the regular expression pattern:
            `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        universalImportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the import Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage. The voyage
            reference must match the regular expression pattern:
            `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        vessel:
          $ref: '#/components/schemas/Vessel'
      description: Transport mode Vessel.
    BargeTransport:
      title: Barge Transport
      required:
        - modeOfTransport
      type: object
      properties:
        modeOfTransport:
          $ref: '#/components/schemas/ModeOfTransport'
        portVisitReference:
          maxLength: 50
          type: string
          description: >-
            The unique reference that can be used to link different
            `transportCallReferences` to the same port visit. The reference is
            provided by the port to uniquely identify a port call.
          example: NLAMS1234589
        transportCallReference:
          maxLength: 100
          type: string
          description: >-
            The unique reference for a transport call. It’s the vessel
            operator’s responsibility to provide the Transport Call Reference,
            other parties are obliged to pick it up and use it. It can take the
            form of Port Call References as defined in OVS Definitions Document,
            or alternatively a reference as defined by the vessel operator.
          example: SR11111X-9321483-2107W-NLAMS-ACT-1-1
        servicePartners:
          type: array
          items:
            $ref: '#/components/schemas/ServicePartner'
        universalServiceReference:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          description: >
            A global unique service reference, as per DCSA standard, agreed by
            VSA partners for the service. The service reference must match the
            regular expression pattern: `SR\d{5}[A-Z]`. The letters `SR`
            followed by `5` digits, followed by a checksum-character as a
            capital letter from `A to Z`.
          example: SR12345A
        universalExportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the export Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage.The voyage reference
            must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        universalImportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: >
            A global unique voyage reference for the import Voyage, as per DCSA
            standard, agreed by VSA partners for the voyage.The voyage reference
            must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est,
            `S`outh or `R`oundtrip).
          example: 2103N
        barge:
          $ref: '#/components/schemas/Barge'
      description: Transport mode Barge.
    OtherTransport:
      title: Other Transport
      required:
        - modeOfTransport
      type: object
      properties:
        modeOfTransport:
          $ref: '#/components/schemas/ModeOfTransport'
      additionalProperties: false
      description: Other Transport modes.
    Facility:
      title: Facility
      required:
        - facilityCode
        - facilityCodeListProvider
      type: object
      properties:
        facilityCode:
          maxLength: 6
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >
            The code used for identifying the specific facility. This code does
            not include the UN Location Code.The definition of the code depends
            on the `facilityCodeListProvider`. As code list providers maintain
            multiple codeLists the following codeList is used:
              - for `SMDG` - the codeList used is the [SMDG Terminal Code List](https://smdg.org/documents/smdg-code-lists/)
              - for `BIC`  - the codeList used is the [BIC Facility Codes](https://www.bic-code.org/facility-codes/)
          example: ADT
        facilityCodeListProvider:
          type: string
          description: >
            The provider used for identifying the facility Code. Some facility
            codes are only defined in combination with an `UN Location Code`.

            - `BIC` (Requires a UN Location Code) 

            - `SMDG` (Requires a UN Location Code)
          example: SMDG
          enum:
            - BIC
            - SMDG
      description: >-
        A way to express a location using a `Facility`. The facility can either
        be expressed using a `BIC` code or a `SMDG` code. The `facilityCode`
        does not contain the `UNLocationCode` - this should be provided in the
        `UnLocationCode` attribute.
    ServicePartner:
      title: Service Partner
      type: object
      properties:
        carrierCode:
          maxLength: 4
          pattern: ^\S+$
          type: string
          description: The carrier code based on either the SMDG or SCAC code lists.
          example: MAEU
        carrierCodeListProvider:
          type: string
          description: Identifies the code list provider used for the `carrierCode`.
          example: NMFTA
          enum:
            - SMDG
            - NMFTA
        carrierServiceName:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the service.
          example: Great Lion Service
        carrierServiceCode:
          maxLength: 11
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The carrier-specific code of the service for which the schedule
            details are published.
          example: FE1
        carrierImportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The identifier of an import voyage. The carrier-specific identifier
            of the import Voyage.
          example: 2103S
        carrierExportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: >-
            The identifier of an export voyage. The carrier-specific identifier
            of the export Voyage.
          example: 2103N
      description: >-
        The service code and voyage number as identified by the carriers that
        are partners in the service.
    Leg:
      title: Leg
      required:
        - arrival
        - departure
      type: object
      properties:
        sequenceNumber:
          type: integer
          description: Sequence number of the leg.
          format: int32
          example: 1
        transport:
          description: The mode of transport as defined by DCSA.
          oneOf:
            - $ref: '#/components/schemas/VesselTransport'
            - $ref: '#/components/schemas/BargeTransport'
            - $ref: '#/components/schemas/OtherTransport'
        departure:
          $ref: '#/components/schemas/PlaceOfDeparture'
        arrival:
          $ref: '#/components/schemas/PlaceOfArrival'
      description: >-
        Leg of the Point-to-Point routing. The property `Leg` can be conformed
        by as many leg as needed and this leg must be identified with a sequence
        number.
    Location:
      title: Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: An optional name for the location.
          example: Port of Amsterdam
        address:
          $ref: '#/components/schemas/Address'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: >
            The UN Location code specifying where the place is located. The
            pattern used must be


            - 2 characters for the country code using [ISO 3166-1
            alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z
            and numbers from 2-9 can be used


            More info can be found here:
            [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)
          example: NLAMS
        facility:
          $ref: '#/components/schemas/Facility'
      description: |
        The location can be specified using **any** of the nested structures:
          - `Address` (used to specify the location via an Address)
          - `UNLocationCode`
          - `Facility` (used to specify a location using a `facilityCode` and a `facilityCodeListProvider`)

          It is expected that if a location is specified in multiple ways (both as an `Address` and as a `Facility`) that both ways point to the same location.
    ModeOfTransport:
      type: string
      description: >
        Remark BENDZJO ITAM-1141: we had to merge all MOTs into one object,
        otherwise the generator generated different stubs, which in turn didn't
        match the correct setters'

        The mode of transport as defined by DCSA. The allowed values for the
        Other Transport mode are:

        - `VESSEL` (Added here to enable the generation)

        - `BARGE`(Added here to enable the generation)

        - `RAIL` (When the transport mode is Rail)

        - `TRUCK`(When the transport mode is Truck)

        - `RAIL_TRUCK`(When rail and truck are expected to be the mode of
        transport in a leg of a proposed routing)

        - `BARGE_TRUCK`(When barge and truck are expected to be the mode of
        transport in a leg of a proposed routing)

        - `BARGE_RAIL`(When barge and rail are expected to be the mode of
        transport in a leg of a proposed routing)

        - `MULTIMODAL`(When mode of transport is not really defined or unknown
        at this stage)
      example: VESSEL
      enum:
        - VESSEL
        - BARGE
        - RAIL_TRUCK
        - BARGE_TRUCK
        - BARGE_RAIL
        - MULTIMODAL
        - RAIL
        - TRUCK
    TransportCallLocation:
      title: TransportCall Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: An optional name for the location.
          example: Port of Amsterdam
        address:
          $ref: '#/components/schemas/Address'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: >
            The UN Location code specifying where the place is located. The
            pattern used must be

              - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)
              - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used

              More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)
          example: NLAMS
        facilitySMDGCode:
          maxLength: 6
          type: string
          description: >-
            The code used for identifying the specific facility. This code does
            not include the UN Location Code.

            The codeList used by SMDG is the [SMDG Terminal Code
            List](https://smdg.org/documents/smdg-code-lists/)
          example: ACT
      description: >
        General purpose object to capture location-related data, the location
        can be specified in **any** of the following ways:
          - `Address` (used to specify the location via an Address)
          - `UNLocationCode`
          - `FacilitySMDGCode` (used to specify a location using a `facilitySMDGCode`)
          It is expected that if a location is specified in multiple ways (both as an `Address` and as a `Facility`) that both ways point to the same location.
    DetailedError:
      title: Detailed Error
      required:
        - errorCodeMessage
        - errorCodeText
      type: object
      properties:
        errorCode:
          maximum: 9999
          minimum: 7000
          type: integer
          description: >
            The detailed error code returned.

              - `7000-7999` Technical error codes
              - `8000-8999` Functional error codes
              - `9000-9999` API provider-specific error codes            

            [Error codes as specified by
            DCSA](https://developer.dcsa.org/standard-error-codes).
          format: int32
          example: 7003
        property:
          maxLength: 100
          type: string
          description: The name of the property causing the error.
          example: facilityCode
        value:
          maxLength: 500
          type: string
          description: >-
            The value of the property causing the error serialised as a string
            exactly as in the original request.
          example: SG SIN WHS
        jsonPath:
          maxLength: 500
          type: string
          description: >-
            A path to the property causing the error, formatted according to
            [JSONpath](https://github.com/json-path/JsonPath).
          example: $.location.facilityCode
        errorCodeText:
          maxLength: 100
          type: string
          description: A standard short description corresponding to the `errorCode`.
          example: invalidData
        errorCodeMessage:
          maxLength: 5000
          type: string
          description: >-
            A long description corresponding to the `errorCode` with additional
            information.
          example: Spaces not allowed in facility code
      description: A detailed description of what has caused the error.
  parameters:
    Api-Version-Major:
      name: API-Version
      in: header
      description: >
        An API-Version header **MAY** be added to the request (optional); if
        added it **MUST** only contain **MAJOR** version. API-Version header
        **MUST** be aligned with the URI version.
      required: false
      style: simple
      explode: false
      schema:
        type: string
        example: '1'
  securitySchemes:
    Client ID Header:
      type: apiKey
      description: The client ID to identify the partner calling the API.
      name: X-IBM-Client-Id
      in: header
      x-key-type: client_id
    Client Secret Header:
      type: apiKey
      description: The client secret belonging to the client ID.
      name: X-IBM-Client-Secret
      in: header
      x-key-type: client_secret
