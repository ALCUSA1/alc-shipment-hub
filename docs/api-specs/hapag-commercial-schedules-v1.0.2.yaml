openapi: 3.0.3
info:
  title: DCSA Commercial Schedules API - Point to Point Routes and Vessel Schedules
  description: >
    # Overview 


    The DCSA Commercial Schedules API provides a standardized approach to
    accessing shipping schedules, enhancing transparency and efficiency in the
    maritime industry. This API is specifically designed to offer Point-to-Point
    Routing information, allowing users to access detailed schedule data for
    shipments in the pre-booking phase. It now also supports the Vessel Schedule
    endpoint, which provides detailed vessel timetables including estimated
    departure and arrival times for each port call on a vessel’s rotation. By
    providing comprehensive routing options, the API helps improve planning and
    operational efficiency for Beneficial Cargo Owners (BCOs), Logistics Service
    Providers (LSPs), and Solution Platforms. 


    ## Use Cases 


    The Commercial Schedules API supports several key business use cases.
      
    ### Point-to-Point Routing Endpoint
      - **Optimizing Supply Chain Efficiency and Strategic Planning**: By accessing multiple estimated end-to-end route options, businesses can optimize their supply chain operations, reduce transit times, and ensure timely deliveries. The data also supports strategic planning by helping companies align inventory levels, transport capacity, and logistics resources with business objectives.
      - **Improving Customer Service**: Logistics providers can use detailed schedule information to offer customers accurate and reliable transit data, enhancing transparency and building trust throughout the shipping process.
      - **Risk Management**: Access to comprehensive routing information enables businesses to anticipate potential delays, disruptions, or capacity issues. This visibility allows for proactive risk mitigation and more resilient logistics planning. 
        
    ### Vessel Schedule Endpoint
      - **Emission Reporting and Sustainability Tracking**: By leveraging detailed vessel rotation data, customers can calculate and report CO₂ emissions for specific voyages or shipments. This supports sustainability initiatives, enables compliance with environmental regulations, and helps organizations meet internal and customer-driven sustainability goals.
      - **Operational Coordination and Planning**: Terminal operators, port authorities, and inland transport providers can use vessel schedule data to optimize berth allocation, resource deployment, and intermodal connections. Access to accurate arrival and departure times enhances efficiency and minimizes operational bottlenecks across the supply chain.
      - **Supply Chain Visibility and Predictive Planning**: Beneficial Cargo Owners (BCOs) and Logistics Service Providers (LSPs) can integrate vessel schedule data into their logistics systems to improve end-to-end visibility. This enables better forecasting of cargo arrivals, proactive exception management, and enhanced service reliability for customers.

    Each endpoint can be implemented independently, offering flexibility based
    on specific business needs.


    ## DCSA Compliance 


    The Point-to-Point Routing API endpoint is fully compliant with the
    standards set by the Digital Container Shipping Association (DCSA). This
    ensures interoperability and consistency across the shipping industry. While
    the current API focuses on Point-to-Point Routing, additional endpoints for
    Port Schedules and Vessel Schedules are planned for future releases, further
    expanding the capabilities of the DCSA Commercial Schedules API. 


    # Who can get access? 


    The API is available to all stakeholders in the shipping and logistics
    industry, including BCOs, LSPs, and Solution Platforms. Access is granted
    after registration and approval. You can request access while subscribing to
    the API. Subscription requests for the Tryout plan are approved immediately.
    Subscription requests for the Basic plan are reviewed and approved manually
    by our team. For Basic plan requests, manual validation may take a few days,
    and you will be notified via email if the status of your request changes.


    ## Authentication 


    Authentication is required to access the API endpoint. Users must provide a
    Client ID and Client Secret in the request headers to authenticate their
    application. These credentials are issued upon successful registration and
    application creation on the API Portal. 


    # Getting Started 


    To effectively utilize the Point-to-Point Routing endpoint, follow these
    steps: 


    1. Endpoint: Use the

       - GET /v1/point-to-point-routes endpoint to retrieve routing information.

       - GET /v1/vessel-schedules endpoint to retrieve vessel schedule information.

    2. Required Parameters: 

       - placeOfReceipt: Specify the UN Location Code where the shipment is received. 

       - placeOfDelivery: Specify the UN Location Code where the shipment is delivered. 

    3. Optional Parameters: 

       - departureStartDate and departureEndDate: Limit results based on departure date. 

       - arrivalStartDate and arrivalEndDate: Limit results based on arrival date. 

       - maxTranshipment: Limit the maximum number of transhipments allowed in the returned routings. If set to 0, only direct routings are returned. 

       - receiptTypeAtOrigin and deliveryTypeAtDestination: Define the type of service at origin and destination (CY, SD, CFS). 

    Ensure that all requests include the necessary authentication headers and
    comply with the API's request parameter requirements. 


    # Rate Limits (Plans) 


    The Tryout plan allows you to integrate our API and explore its features at
    a limited rate - perfect for initial testing and development, with immediate
    approval upon subscription. When moving to production workloads, subscribe
    to our Basic plan, which is reviewed and approved manually by our team. If
    your usage exceeds the standard limits, please contact your account manager.


    | Plan | Description | Limits | 

    |-------|---------------|----------------------| 

    | Tryout | For initial testing and development. | 50 calls per hour, 1 call
    per second | 

    | Basic  | For standard users with moderate access needs. | 1500 calls per
    hour, 90 calls per minute, 4 calls per second | 




    # FAQs 


    <details> 
        <summary> How do I specify the location in my requests? </summary> 
        <div> 
    Use UN Location Codes to specify places of receipt and delivery. [UN
    Location
    Codes](https://unece.org/trade/cefact/unlocode-code-list-country-and-territory)
    For example DEHAM to SGSIN. 
        </div> 
    </details> 


    <details> 
        <summary> What happens if I exceed the rate limit? </summary> 
        <div> 
    If you exceed the rate limit, your requests may be temporarily blocked –
    resulting in a ‘429 Too Many Requests’ error code. Please ensure that API
    requests are made within your available quota limits. Ideally, requests
    should be evenly distributed to avoid spikes. 
        </div> 
    </details> 


    <details> 
        <summary> Does the API support transshipments? </summary> 
        <div> 
    Yes, it does. The API supports transshipment in the response, but it does
    not allow you to specify the exact transshipment locations in the request. 
        </div> 
    </details> 





    # Release Notes 


    <b>Release Date:</b> Nov 2025<br />

    <b>Version:</b> 1.0  <br />

    <b>Description:</b> Fully compliant with the DCSA v1.0 (Point-to-Point
    Routing and Vessel Schedules) <br />


    | Key Enhancements & Changes | Description | 

    |---------------------------------------------|-------------------------| 

    | <b>Introduce Vessel Schedules Endpoint</b> | Providing new REST endpoint
    for Vessel Schedules  | 



    ---     


    <b>Release Date:</b> May 2025<br />

    <b>Version:</b> 1.0  <br />

    <b>Description:</b> Fully compliant with the DCSA v1.0 (Point-to-Point
    Routing) <br />


    | Key Enhancements & Changes | Description | 

    |---------------------------------------------|-------------------------| 

    | <b>Fully DSCA Compliant</b> | Ensures seamless interoperability across
    carriers and platforms, enabling standardized, future-proof integrations in
    global container shipping. | 

    | <b>Improved Filtering</b> | Replaced `:gte`/`:lte` datetime filters with
    intuitive `departureStartDate`, `departureEndDate`, `arrivalStartDate`,
    `arrivalEndDate`. Added `maxTranshipment` to control routing complexity | 

    | <b>Standardized Error Handling</b> | Unified `ErrorResponse` schema with
    detailed error codes and JSONPath references. Improved debugging and
    traceability with `providerCorrelationReference`. | 

    | <b>Improved Documentation</b> | Linked to DCSA Interface Standards, GitHub
    repositories, and API Design Principles. Clearer parameter descriptions and
    usage examples. | 



    --- 



    <b>Release Date:</b> July 2024 <br />

    <b>Version:</b> 0.7 <br />

    <b>Description:</b> Initial release <br />
